# ---------------------------------------------------------------------------
# Encoder registry metadata: where weights come from and how to load them.
# Edit `checkpoint` paths after running scripts/00_download_weights.py.
# Each key matches a name in encoders/registry.py.
# ---------------------------------------------------------------------------

resnet18_supervised:
  family: resnet
  arch: resnet18
  paradigm: supervised
  feature_dim: 512
  source: torchvision          # uses torchvision IMAGENET1K weights
  checkpoint: null             # null -> torchvision pretrained weights
  pool: avgpool                # global average pool output (512-d)

simclr_resnet18:
  family: resnet
  arch: resnet18
  paradigm: contrastive
  feature_dim: 512
  source: local
  # Convert an official SimCLR checkpoint to a torchvision-compatible state_dict.
  checkpoint: ./weights/simclr_resnet18.pth
  pool: avgpool

# ---------------------------------------------------------------------------
# NOTE on backbone size: the proposal targeted ViT-S/16, but neither MAE nor
# I-JEPA publish official ViT-S/16 weights. The smallest backbone where BOTH
# have official checkpoints is ViT-L/16, so that is the default below.
# The ONLY hard requirement is that I-JEPA and MAE share an IDENTICAL backbone
# (the architecture control). If you locate community ViT-S/16 or ViT-B/16
# weights for both, just change `arch` + `feature_dim` on both blocks together:
#   ViT-S/16 -> arch: vit_small_patch16_224 , feature_dim: 384
#   ViT-B/16 -> arch: vit_base_patch16_224  , feature_dim: 768
#   ViT-L/16 -> arch: vit_large_patch16_224 , feature_dim: 1024
# ---------------------------------------------------------------------------

ijepa_vitl16:
  family: vit
  arch: vit_large_patch16_224
  paradigm: predictive
  feature_dim: 1024
  source: local
  # I-JEPA ViT-L/16 target/context encoder weights (Meta Research).
  checkpoint: ./weights/ijepa_vitl16.pth
  pool: mean                   # mean over patch tokens (I-JEPA has no CLS token)

mae_vitl16:
  family: vit
  arch: vit_large_patch16_224  # MUST match ijepa backbone (architecture control)
  paradigm: reconstruction
  feature_dim: 1024
  source: local
  # MAE ViT-L/16 encoder weights (Facebook Research): mae_pretrain_vit_large.pth
  checkpoint: ./weights/mae_vitl16.pth
  pool: mean                   # mean over patch tokens (drop CLS), matches I-JEPA
